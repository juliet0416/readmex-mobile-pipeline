name: iOS Release
run-name: iOS ${{ inputs.version }} (${{ inputs.build_number || '自动' }}) · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit or tag
        required: true
      version:
        description: Semver, for example 1.0.0
        required: true
      build_number:
        description: Optional CFBundleVersion override; empty resolves the next build automatically
        required: false
      expected_source_sha:
        description: Optional source SHA to verify after checkout
        required: false
      submit:
        description: Upload IPA to TestFlight
        type: boolean
        default: false
      clear_cache:
        description: Remove runner-local Xcode and SwiftPM build cache before archive
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: readmex-ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build_result: ${{ steps.artifact.outcome }}
      submit_result: ${{ steps.asc.outcome == 'failure' && 'failure' || steps.submit.outcome }}
      processing_result: ${{ steps.verify.outputs.processing_result }}
      build_number: ${{ steps.number.outputs.build_number }}
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
      testflight_url: ${{ steps.asc.outputs.testflight_url }}
    env:
      SOURCE_REPO: ${{ vars.SOURCE_REPO }}
      IOS_APP_BUNDLE_ID: ${{ vars.IOS_APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
      - name: Record source commit
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          sha=$(git -C source rev-parse HEAD)
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo 'Source tag changed after release preflight'; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release build number
        id: number
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-build-number.mjs ios source/mobile-app
      - name: Verify native source and resources
        run: |
          node scripts/native-source.mjs ios source/mobile-app
          npm exec --yes --package=tsx@4.20.0 -- tsx source/scripts/mobile-native/sync-locales.ts --check
      - uses: actions/cache@v4
        if: ${{ !inputs.clear_cache }}
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: native-ios-swiftpm-26.6-${{ hashFiles('source/mobile-app/native/ios/ReadmeX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Install signing material
        id: signing
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
        run: bash scripts/install-ios-signing.sh
      - name: Prepare iOS release
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ steps.number.outputs.build_number }}
          GETUI_APP_ID: ${{ secrets.GETUI_IOS_APP_ID }}
          GETUI_APP_KEY: ${{ secrets.GETUI_IOS_APP_KEY }}
          GETUI_APP_SECRET: ${{ secrets.GETUI_IOS_APP_SECRET }}
        run: node scripts/prepare-ios.mjs source/mobile-app
      - name: Select unit test simulator
        id: simulator
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          iphones=[d['udid'] for runtime in sorted(devices, reverse=True) if 'iOS-' in runtime for d in devices[runtime] if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not iphones: raise RuntimeError('No iPhone simulator is available')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('udid='+iphones[0]+'\n')
          PYCODE
      - name: Test native iOS
        working-directory: source/mobile-app/native/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test -project ReadmeX.xcodeproj -scheme ReadmeX \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/NativeTests" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -skipPackageUpdates \
            -only-testing:ReadmeXTests CODE_SIGN_IDENTITY=-
      - name: Archive
        working-directory: source/mobile-app/native/ios
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          xcodebuild archive \
            -project ReadmeX.xcodeproj \
            -scheme ReadmeX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NativeRelease" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -skipPackageUpdates \
            -archivePath "$RUNNER_TEMP/ReadmeX.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Repair pinned Getui framework metadata
        run: python3 scripts/repair-getui-metadata.py "$RUNNER_TEMP/ReadmeX.xcarchive/Products/Applications/ReadmeX.app" source/mobile-app/native/ios/ReadmeX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Export IPA
        id: export
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict><key>${IOS_APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ReadmeX.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Verify exported native IPA
        id: verify_ipa
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ steps.number.outputs.build_number }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          ditto -x -k "$ipa" "$RUNNER_TEMP/verified-ipa"
          python3 scripts/verify-ios-artifact.py "$RUNNER_TEMP/verified-ipa/Payload/ReadmeX.app" "$RUNNER_TEMP/ReadmeX.xcarchive/dSYMs/ReadmeX.app.dSYM" > "$RUNNER_TEMP/native-ios-metadata.json"
          shasum -a 256 "$ipa" > "$RUNNER_TEMP/ios-sha256.txt"
      - name: Upload iOS symbols and metadata
        uses: actions/upload-artifact@v4
        with:
          name: ios-symbols-${{ inputs.version }}-${{ steps.number.outputs.build_number }}
          path: |
            ${{ runner.temp }}/ReadmeX.xcarchive/dSYMs
            ${{ runner.temp }}/native-ios-metadata.json
            ${{ runner.temp }}/ios-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload IPA artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ inputs.version }}-${{ steps.number.outputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Verify App Store Connect access
        if: inputs.submit
        id: asc
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/app-store-connect.mjs preflight
      - name: Upload IPA to TestFlight
        if: inputs.submit
        id: submit
        timeout-minutes: 15
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/asc-private-keys
        run: |
          set -euo pipefail
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          node scripts/upload-testflight.mjs "$ipa"
      - name: Verify Apple processing
        if: inputs.submit
        id: verify
        timeout-minutes: 12
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ steps.asc.outputs.app_id }}
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ steps.number.outputs.build_number }}
        run: node scripts/app-store-connect.mjs verify
      - name: Cleanup signing material
        if: always()
        run: |
          rm -rf .private "$RUNNER_TEMP/asc-private-keys"
          rm -f source/mobile-app/native/ios/Config/Local.xcconfig
          security delete-keychain "$RUNNER_TEMP/mobile-signing.keychain-db" || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}

  release_assets:
    needs: build
    if: always() && startsWith(inputs.ref, 'mobile-v') && needs.build.outputs.build_result == 'success' && needs.build.outputs.artifact_url != ''
    uses: ./.github/workflows/release-assets.yml
    with:
      ref: ${{ inputs.ref }}
      source_sha: ${{ needs.build.outputs.source_sha }}
      version: ${{ inputs.version }}
      build_number: ${{ needs.build.outputs.build_number }}
      platform: ios
      artifact_type: ipa
      artifact_run_id: ${{ github.run_id }}
    secrets: inherit

  notify:
    needs: [build, release_assets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Notify Feishu release bot
        env:
          FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}
          FEISHU_RELEASE_WEBHOOK_SECRET: ${{ secrets.FEISHU_RELEASE_WEBHOOK_SECRET || secrets.FEISHU_RELEASE_WEBHOOK_SECRE }}
          FEISHU_RELEASE_LANG: ${{ vars.FEISHU_RELEASE_LANG || 'zh' }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          BUILD_RESULT: ${{ needs.build.outputs.build_result == 'success' && 'success' || needs.build.result }}
          SUBMIT_RESULT: ${{ needs.build.outputs.submit_result }}
          PROCESSING_RESULT: ${{ needs.build.outputs.processing_result }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.build.outputs.build_number || inputs.build_number }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_ARCHIVE_RESULT: ${{ needs.release_assets.result }}
          RELEASE_TAG_URL: ${{ needs.release_assets.outputs.release_url }}
          RELEASE_TAG_IPA_URL: ${{ needs.release_assets.outputs.ipa_url }}
          RELEASE_SUBMIT: ${{ inputs.submit }}
          RELEASE_ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          RELEASE_TESTFLIGHT_URL: ${{ needs.build.outputs.testflight_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-feishu-release.mjs
