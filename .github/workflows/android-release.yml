name: Android Release
run-name: Android ${{ inputs.version }} (${{ inputs.build_number }}) · ${{ inputs.artifact_type }} · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pushed source commit, branch or tag
        required: true
      version:
        description: App version, for example 1.0.0
        required: true
      build_number:
        description: Increasing Android versionCode
        required: true
      artifact_type:
        description: Build AAB for Play, APK for download, or both
        type: choice
        options: [aab, apk, both]
        default: aab
      submit:
        description: Upload AAB to Google Play (APK never submits)
        type: boolean
        default: false
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: Save Play draft or release to the selected track
        type: choice
        options: [draft, completed]
        default: draft
      publish_apk:
        description: Publish APK to R2 with versioned and latest downloads
        type: boolean
        default: false
      clear_cache:
        description: Ignore Gradle cache for this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: readmex-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      aab_url: ${{ steps.aab.outputs.artifact-url }}
      apk_url: ${{ steps.apk.outputs.artifact-url }}
      page_size_result: ${{ steps.verify.outcome }}
    env:
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release choices
        env:
          SUBMIT: ${{ inputs.submit }}
          PUBLISH_APK: ${{ inputs.publish_apk }}
        run: |
          case "$ARTIFACT_TYPE" in aab|apk|both) ;; *) echo 'Invalid artifact type'; exit 1 ;; esac
          if [ "$ARTIFACT_TYPE" = apk ] && [ "$SUBMIT" = true ]; then
            echo 'APK cannot submit to Play'; exit 1
          fi
          if [ "$ARTIFACT_TYPE" = aab ] && [ "$PUBLISH_APK" = true ]; then
            echo 'R2 publishing requires APK'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
      - name: Record source commit
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.clear_cache }}
      - name: Install mobile dependencies
        working-directory: source/mobile-app
        run: npm ci
      - name: Sync native project
        working-directory: source/mobile-app
        run: npx cap sync android
      - name: Prepare Android version and signing
        run: node scripts/configure-android.mjs source/mobile-app
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > source/mobile-app/android/app/ci-upload.keystore
          chmod 600 source/mobile-app/android/app/ci-upload.keystore
      - name: Build signed Android artifacts
        working-directory: source/mobile-app/android
        env:
          ORG_GRADLE_PROJECT_CI_UPLOAD_STORE_FILE: ci-upload.keystore
          ORG_GRADLE_PROJECT_CI_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CI_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CI_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          case "$ARTIFACT_TYPE" in
            aab) tasks=(:app:bundleRelease) ;;
            apk) tasks=(:app:assembleRelease) ;;
            both) tasks=(:app:bundleRelease :app:assembleRelease) ;;
          esac
          ./gradlew "${tasks[@]}" --no-daemon --console=plain --stacktrace
      - name: Verify signing and 16 KB compatibility
        id: verify
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          if [ "$ARTIFACT_TYPE" != apk ]; then
            aab=source/mobile-app/android/app/build/outputs/bundle/release/app-release.aab
            test -s "$aab"
            jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$aab" > "$RUNNER_TEMP/aab-signature.log"
            python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); assert "jar verified." in s and "jar is unsigned" not in s, "AAB signature is not verified"' "$RUNNER_TEMP/aab-signature.log"
            python3 source/scripts/check-android-page-size.py "$aab"
            cp "$aab" "$RUNNER_TEMP/artifacts/readmex-${APP_VERSION}-${APP_BUILD_NUMBER}.aab"
          fi
          if [ "$ARTIFACT_TYPE" != aab ]; then
            apk=source/mobile-app/android/app/build/outputs/apk/release/app-release.apk
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            python3 source/scripts/check-android-page-size.py "$apk"
            cp "$apk" "$RUNNER_TEMP/artifacts/readmex-${APP_VERSION}-${APP_BUILD_NUMBER}.apk"
          fi
      - name: Save AAB artifact
        if: inputs.artifact_type != 'apk'
        id: aab
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Save APK artifact
        if: inputs.artifact_type != 'aab'
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup signing material
        if: always()
        run: rm -f source/mobile-app/android/app/ci-upload.keystore

  submit:
    needs: build
    if: inputs.submit && inputs.artifact_type != 'apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/artifacts
      - name: Decode Google Play credentials
        id: account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/google-play.mjs decode
      - name: Verify Google Play access
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ steps.account.outputs.json_path }}
          APP_PACKAGE_ID: ${{ vars.APP_PACKAGE_ID }}
        run: node scripts/google-play.mjs preflight
      - name: Prepare tracked Play release edit
        id: play_edit
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ steps.account.outputs.json_path }}
          APP_PACKAGE_ID: ${{ vars.APP_PACKAGE_ID }}
        run: node scripts/google-play.mjs prepare
      - name: Upload AAB to Google Play
        id: play
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          existingEditId: ${{ steps.play_edit.outputs.edit_id }}
          serviceAccountJson: ${{ steps.account.outputs.json_path }}
          packageName: ${{ vars.APP_PACKAGE_ID }}
          releaseFiles: ${{ runner.temp }}/artifacts/*.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
      - name: Recover and verify failed Play commit
        if: steps.play.outcome == 'failure'
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ steps.account.outputs.json_path }}
          APP_PACKAGE_ID: ${{ vars.APP_PACKAGE_ID }}
          PLAY_EDIT_ID: ${{ steps.play_edit.outputs.edit_id }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
          PLAY_AAB_FILE: ${{ runner.temp }}/artifacts/readmex-${{ inputs.version }}-${{ inputs.build_number }}.aab
        run: node scripts/google-play.mjs recover
      - name: Cleanup Play credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/readmex-play-service-account.json"

  publish:
    needs: build
    if: inputs.publish_apk && inputs.artifact_type != 'aab'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ inputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/artifacts
      - name: Publish APK to R2 and verify public downloads
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
          R2_OBJECT_PREFIX: ${{ secrets.R2_OBJECT_PREFIX || vars.R2_OBJECT_PREFIX || 'readmex/app-update' }}
          R2_SOURCE: ${{ runner.temp }}/artifacts/readmex-${{ inputs.version }}-${{ inputs.build_number }}.apk
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node scripts/upload-r2.mjs

  notify:
    needs: [build, submit, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Notify Feishu release bot
        env:
          FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}
          FEISHU_RELEASE_WEBHOOK_SECRET: ${{ secrets.FEISHU_RELEASE_WEBHOOK_SECRET || secrets.FEISHU_RELEASE_WEBHOOK_SECRE }}
          FEISHU_RELEASE_LANG: ${{ vars.FEISHU_RELEASE_LANG || 'en' }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          RELEASE_PLATFORM: android
          RELEASE_ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          BUILD_RESULT: ${{ needs.build.result }}
          SUBMIT_RESULT: ${{ needs.submit.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PAGE_SIZE_RESULT: ${{ needs.build.outputs.page_size_result }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_SUBMIT: ${{ inputs.submit }}
          RELEASE_PUBLISH_APK: ${{ inputs.publish_apk }}
          RELEASE_AAB_URL: ${{ needs.build.outputs.aab_url }}
          RELEASE_APK_URL: ${{ needs.build.outputs.apk_url }}
          RELEASE_PLAY_URL: ${{ vars.PLAY_CONSOLE_APP_URL || 'https://play.google.com/console' }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
          R2_OBJECT_PREFIX: ${{ secrets.R2_OBJECT_PREFIX || vars.R2_OBJECT_PREFIX || 'readmex/app-update' }}
          RELEASE_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-feishu-release.mjs
